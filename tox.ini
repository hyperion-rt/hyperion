[tox]
envlist =
    py{39,310,311,312,313}-test{,-bitlevel}{,-nobinaries}
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true

[testenv]
changedir = .tmp/{envname}
setenv =
    # The MPI tests run all processes on one machine, so restrict UCX (used by
    # some MPI builds, such as the Ubuntu MPICH package) to shared memory.
    # Otherwise it can try to use InfiniBand transports on network devices
    # that do not support them, and MPI fails to start, and with TCP allowed
    # the MPI tests hang on the Ubuntu 24.04 GitHub Actions runners.
    UCX_TLS=self,sm
    bitlevel: BITFLAGS= --enable-bit-level-tests
    # The bit-level reference results come from unoptimized builds.
    bitlevel: CONFFLAGS= --disable-optimization
    # GitHub Actions runners are a mix of CPUs with and without AVX-512, and
    # NumPy's AVX-512 (SVML) kernels for transcendental functions round
    # differently from the AVX2 ones, so the generated model input files (and
    # hence the Monte Carlo results) depend on which runner the job lands on.
    # Disabling AVX-512 dispatch forces the same kernels on every machine.
    bitlevel: NPY_DISABLE_CPU_FEATURES=X86_V4 AVX512_ICL AVX512_SPR
    nobinaries: BINFLAGS= -m "not requires_hyperion_binaries"
deps =
    pytest-timeout
    bitlevel: numpy==2.4.*
extras =
    recommended
    test: test
allowlist_externals =
    {toxinidir}/configure
    make
    mv
commands =
    pip freeze
    !nobinaries: {toxinidir}/configure --prefix={envdir} {env:CONFFLAGS}
    !nobinaries: mv Makefile {toxinidir}/
    !nobinaries: make -C {toxinidir} -j4 serial mpi
    !nobinaries: make -C {toxinidir} install
    # Fail any test that takes more than 10 minutes, so that a hang (e.g. in
    # MPI) does not block the CI job until it times out
    pytest --pyargs hyperion --timeout=600 {env:BITFLAGS} {env:BINFLAGS} {posargs}
